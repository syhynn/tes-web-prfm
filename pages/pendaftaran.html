<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="theme-color" content="#222222">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran & Konsultasi - Performance Group</title>
    <link rel="icon" type="image/png" href="../images/FAVICON.svg">
    
    <!-- Menghubungkan ke file CSS Utama -->
    <link rel="stylesheet" href="../style.css">

    <!-- CSS Tambahan Khusus untuk Halaman Pendaftaran Murni -->
    <style>
        /* Tombol Kembali di Pojok Kiri Atas */
        .btn-back-corner {
            position: absolute;
            top: 30px;
            left: 30px;
            background-color: #222222;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .btn-back-corner:hover {
            background-color: #e61d25;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(230, 29, 37, 0.4);
        }

        /* Penyesuaian form section untuk mengisi tinggi layar penuh */
        .form-section {
            min-height: 100vh !important;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 5%;
        }

        /* PERBAIKAN: Membatasi textarea agar hanya bisa ditarik vertikal (ke bawah) */
        .input-group textarea {
            resize: vertical;
            max-height: 300px; /* Batas maksimal tarikan ke bawah */
        }

        @media (max-width: 768px) {
            .btn-back-corner {
                top: 20px;
                left: 20px;
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol Kembali Pojok Kiri Atas -->
    <a href="../index.html" class="btn-back-corner" title="Kembali ke Beranda">
        &larr; Kembali
    </a>

    <!-- SECTION PENDAFTARAN -->
    <section class="form-section" id="pendaftaran">
        <div class="form-container" style="width: 100%; max-width: 700px; margin: auto;">
            <div class="form-header">
                <h1 class="section-title text-white" style="margin-top: 10px;">Konsultasi Layanan Bengkel</h1>
                <p class="form-subtitle">Isi formulir di bawah ini dan tim kami akan segera menghubungi Anda melalui WhatsApp.</p>
            </div>

            <!-- Endpoint Formspree -->
            <form action="https://formspree.io/f/mwleedyp" method="POST" class="custom-form">
                
                <div class="input-group">
                    <label for="nama_lengkap">Nama Lengkap / Nama Bengkel *</label>
                    <input type="text" id="nama_lengkap" name="nama_lengkap" placeholder="Masukkan nama Anda" required>
                </div>

                <div class="input-group">
                    <label for="nomor_wa">Nomor WhatsApp *</label>
                    <input type="tel" id="nomor_wa" name="nomor_wa" placeholder="Contoh: 08123456789" required minlength="10" pattern="[0-9]{10,}" title="Harap masukkan minimal 10 digit angka" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>

                <div class="input-group">
                    <label for="layanan">Layanan yang Dibutuhkan *</label>
                    <select id="layanan" name="layanan" required>
                        <option value="" disabled selected>Pilih Layanan</option>
                        <option value="PRFM">Manajemen Operasional Bengkel</option>
                        <option value="Solusi Akademi">Ekosistem Pertumbuhan Bisnis</option>
                        <option value="Towing PRFM">Manajemen SDM & Organisasi</option>
                        <option value="Edukasi Otomotif">Digitalisasi & Sistem</option>
                        <option value="Edukasi Otomotif">Pelatihan & Pengembangan Kapabilitas</option>
                        <option value="Edukasi Otomotif">Audit, Pengendalian Mutu & Perbaikan Berkelanjutan</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="pesan">Pesan atau Kendala yang Dihadapi *</label>
                    <textarea id="pesan" name="pesan" rows="4" placeholder="Ceritakan singkat mengenai kebutuhan Anda..." required></textarea>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="btn-submit">
                    Kirim Permintaan &rarr;
                </button>
            </form>
        </div>
    </section>

    <!-- Script Menu Mobile -->
    <script src="../script.js"></script>
</body>
</html>
