<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Sedang Dikembangkan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Pengaturan Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Latar Belakang Gradasi Ala Bengkel (Oli/Metalik) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2a2a2a 0%, #121212 80%);
            z-index: -1;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* --- BAGIAN ANIMASI BENGKEL --- */
        .workshop-animation {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Roda Gigi (Gear) Berputar */
        .gear {
            position: absolute;
            width: 120px;
            height: 120px;
            animation: spin 6s linear infinite;
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.4));
        }

        /* Kunci Pas (Wrench) Mengayun/Mengencangkan */
        .wrench {
            position: absolute;
            width: 80px;
            height: 80px;
            top: 10px;
            right: 10px;
            transform-origin: bottom left;
            animation: tighten 1.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes tighten {
            0% { transform: rotate(-20deg); }
            100% { transform: rotate(40deg); }
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #f8fafc;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 span {
            color: #f59e0b; /* Warna Kuning Oranye (Amber) */
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* --- PROGRESS BAR (CAUTION TAPE) --- */
        .caution-wrapper {
            width: 100%;
            height: 25px;
            border-radius: 50px;
            overflow: hidden;
            background-color: #1e293b;
            border: 2px solid #334155;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            position: relative;
            margin-bottom: 35px; /* Jarak untuk tombol kembali */
        }

        .caution-tape {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #f59e0b,
                #f59e0b 20px,
                #0f172a 20px,
                #0f172a 40px
            );
            background-size: 56px 56px;
            animation: moveTape 2s linear infinite;
        }

        @keyframes moveTape {
            0% { background-position: 0 0; }
            100% { background-position: -56px 0; }
        }

        /* --- TOMBOL KEMBALI --- */
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: transparent;
            color: #f59e0b;
            text-decoration: none;
            font-weight: 700;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        .back-btn:hover {
            background-color: #f59e0b;
            color: #121212;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        /* Responsif */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1rem; }
            .workshop-animation { width: 120px; height: 120px; margin-bottom: 30px; }
            .gear { width: 100px; height: 100px; }
            .wrench { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Animasi Vektor (SVG) -->
        <div class="workshop-animation">
            <!-- SVG Roda Gigi -->
            <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            
            <!-- SVG Kunci Pas -->
            <svg class="wrench" viewBox="0 0 24 24" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
        </div>

        <!-- Teks Pemberitahuan -->
        <h1>SEDANG DI-<span>DIKEMBANGKAN</span>!</h1>
        <p>Harap bersabar, mekanik ahli kami sedang merakit dan mengencangkan baut-baut di halaman ini. Kami akan segera kembali melaju kencang dengan performa maksimal.</p>

        <!-- Garis Pembatas Proyek Ala Konstruksi/Bengkel -->
        <div class="caution-wrapper">
            <div class="caution-tape"></div>
        </div>

        <!-- Tombol Kembali -->
        <!-- Gunakan href="javascript:history.back()" untuk kembali ke halaman sebelumnya secara otomatis, atau ganti dengan link beranda Anda misal href="index.html" -->
        <a href="javascript:history.back()" class="back-btn">
            &larr; Kembali ke Garasi
        </a>

    </div>

</body>
</html>
